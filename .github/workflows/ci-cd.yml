name: CI/CD Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.8"
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Initialize test database
        run: |
          python - <<'PY'
          import sqlite3

          with sqlite3.connect('users.db') as connection:
              connection.execute(
                  'CREATE TABLE IF NOT EXISTS users '
                  '(id INTEGER PRIMARY KEY, username TEXT NOT NULL)'
              )
          PY

      - name: Run smoke tests
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()
          assert client.get('/').status_code == 200
          assert client.get('/user?id=missing').status_code == 404
          assert client.get('/token').status_code == 200
          print('Smoke tests passed')
          PY

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify SonarQube server is reachable
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        env:
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        run: |
          sonar_url="${SONAR_HOST_URL%/}"
          case "$sonar_url" in
            http://localhost*|https://localhost*|http://127.0.0.1*|https://127.0.0.1*)
              echo "SONAR_HOST_URL points to localhost. GitHub-hosted runners cannot access SonarQube running on your local machine."
              echo "Use a public SonarQube URL, SonarCloud, or a self-hosted GitHub runner."
              exit 1
              ;;
          esac
          curl --fail --silent --show-error --connect-timeout 10 "$sonar_url/api/system/status" > /dev/null

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  dast:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    env:
      JFROG_URL: ${{ secrets.JFROG_URL }}
      JFROG_ACCESS_TOKEN: ${{ secrets.JFROG_ACCESS_TOKEN }}
      JFROG_REPOSITORY: ${{ secrets.JFROG_REPOSITORY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install application dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Initialize test database
        run: |
          python - <<'PY'
          import sqlite3

          with sqlite3.connect('users.db') as connection:
              connection.execute(
                  'CREATE TABLE IF NOT EXISTS users '
                  '(id INTEGER PRIMARY KEY, username TEXT NOT NULL)'
              )
          PY

      - name: Start application
        run: |
          python app.py > app.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5000/ && exit 0
            sleep 1
          done
          cat app.log
          exit 1

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:5000

      - name: Set up JFrog CLI
        if: ${{ always() && env.JFROG_URL != '' && env.JFROG_ACCESS_TOKEN != '' && env.JFROG_REPOSITORY != '' }}
        uses: jfrog/setup-jfrog-cli@v4

      - name: Publish reports to JFrog
        if: ${{ always() && env.JFROG_URL != '' && env.JFROG_ACCESS_TOKEN != '' && env.JFROG_REPOSITORY != '' }}
        run: |
          jf config add artifact-repository \
            --url="${JFROG_URL%/}" \
            --access-token="${JFROG_ACCESS_TOKEN}" \
            --interactive=false
          jf rt upload "report_*.*" \
            "${JFROG_REPOSITORY}/zap/${GITHUB_REPOSITORY}/${GITHUB_SHA}/" \
            --server-id=artifact-repository \
            --flat=true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_xml.xml

  deploy:
    name: Deploy placeholder
    runs-on: ubuntu-latest
    needs: [test, dependency-scan, sonar, dast]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.test.result == 'success' && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') }}

    steps:
      - name: Deployment hand-off
        run: echo "Add your hosting provider deployment command here."