name: CI/CD Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.8"
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run smoke tests
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()
          assert client.get('/').status_code == 200
          assert client.get('/user?id=missing').status_code == 404
          assert client.get('/token').status_code == 200
          print('Smoke tests passed')
          PY

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  dast:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install application dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Start application
        run: |
          python app.py > app.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5000/ && exit 0
            sleep 1
          done
          cat app.log
          exit 1

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:5000

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_xml.xml

  deploy:
    name: Deploy placeholder
    runs-on: ubuntu-latest
    needs: [test, dependency-scan, sonar, dast]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.test.result == 'success' && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') }}

    steps:
      - name: Deployment hand-off
        run: echo "Add your hosting provider deployment command here."